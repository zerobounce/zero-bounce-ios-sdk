# On every PR: run the XCTest suite (macOS runner, Mac Catalyst destination) and build the Swift Package for the iOS Simulator.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same PR or branch replaces the run in progress.
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # --deployment rejects a lockfile written by another CocoaPods.
          # The runner's pod is newer than Podfile.lock (1.16.2), so install that one.
          version=$(awk '/^COCOAPODS:/{print $2}' Podfile.lock)
          sudo gem install cocoapods -v "$version" --no-document
          pod "_${version}_" install --deployment

      - name: Run tests (Mac Catalyst)
        run: |
          xcodebuild test \
            -workspace "Zero Bounce iOS SDK.xcworkspace" \
            -scheme "Zero Bounce iOS SDK" \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skip-testing:"Zero Bounce iOS SDKTests/LiveApiTests" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

  swift-package:
    name: Build Swift Package (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository root also holds the CocoaPods project and workspace,
      # which xcodebuild would pick instead of Package.swift, so name the
      # package's own workspace explicitly.
      - name: Build Swift Package (iOS Simulator)
        run: |
          xcodebuild build \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme ZeroBounceSDK \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
