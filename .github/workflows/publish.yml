name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.2)
        required: true
      skip_trunk:
        type: boolean
        description: Skip the CocoaPods trunk push (GitHub release only, for example once trunk is read-only)
        default: false

permissions:
  contents: read

# One publish per tag at a time; a second run waits instead of cancelling a release half way.
concurrency:
  group: publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}

          persist-credentials: false
      - name: Verify tag, podspec and Xcode project versions
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PODSPEC_VERSION=$(grep -E '^\s*s\.version\s*=' ZeroBounceSDK.podspec | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$PODSPEC_VERSION" ]; then
            echo "Error: Could not read s.version from ZeroBounceSDK.podspec"
            exit 1
          fi
          if [ "$PODSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: podspec version ($PODSPEC_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          # Every MARKETING_VERSION in the Xcode project must match too, conditional keys
          # (MARKETING_VERSION[sdk=iphoneos*]) included. There are at least two (the SDK target's
          # Debug and Release configurations); a missing entry would leave fewer.
          PBX="Zero Bounce iOS SDK.xcodeproj/project.pbxproj"
          MARKETING_VERSIONS=$(grep -hE '^[[:space:]]*"?MARKETING_VERSION("?\[[^]]*\]"?)?"?[[:space:]]*=' "$PBX" | sed -E 's/^.*(MARKETING_VERSION|\])"?[[:space:]]*=[[:space:]]*"?([^";]*)"?[[:space:]]*;.*/\2/' || true)
          if [ -z "$MARKETING_VERSIONS" ]; then
            echo "Error: Could not read MARKETING_VERSION from project.pbxproj"
            exit 1
          fi
          MV_COUNT=$(printf '%s\n' "$MARKETING_VERSIONS" | wc -l | tr -d ' ')
          if [ "$MV_COUNT" -lt 2 ]; then
            echo "Error: found $MV_COUNT MARKETING_VERSION entries in project.pbxproj, expected at least 2."
            exit 1
          fi
          if [ "$(printf '%s\n' "$MARKETING_VERSIONS" | sort -u)" != "$TAG_VERSION" ]; then
            echo "Error: MARKETING_VERSION in project.pbxproj ($(printf '%s\n' "$MARKETING_VERSIONS" | sort -u | paste -sd, -)) does not match tag ($TAG)."
            exit 1
          fi
          echo "Publishing tag: $TAG (podspec $PODSPEC_VERSION, project $TAG_VERSION in $MV_COUNT entries)"

      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false

      - name: Verify checkout matches validated SHA
        env:
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Error: checked-out commit ($HEAD_SHA) does not match the validated tag commit ($TAG_SHA)."
            exit 1
          fi

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          # Same as sdk_ci.yml: --deployment needs the CocoaPods that wrote the lockfile.
          version=$(awk '/^COCOAPODS:/{print $2}' Podfile.lock)
          sudo gem install cocoapods -v "$version" --no-document
          pod "_${version}_" install --deployment

      - name: Run tests (Mac Catalyst)
        run: |
          xcodebuild test \
            -workspace "Zero Bounce iOS SDK.xcworkspace" \
            -scheme "Zero Bounce iOS SDK" \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -skip-testing:"Zero Bounce iOS SDKTests/LiveApiTests" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      # Same build as sdk_ci.yml, from the tag: the repository root also holds the CocoaPods
      # project and workspace, so name the package's own workspace.
      - name: Build Swift Package (iOS Simulator)
        run: |
          xcodebuild build \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme ZeroBounceSDK \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # The trunk push is its own job: if it fails (or is skipped), the GitHub release below is still created.
  publish:
    name: Publish to CocoaPods
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event.inputs.skip_trunk != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false

      - name: Verify checkout matches validated SHA
        env:
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TAG_SHA" ] || [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Error: checked-out commit ($HEAD_SHA) does not match the validated tag commit ($TAG_SHA)."
            exit 1
          fi

      - name: Install CocoaPods (the version in Podfile.lock)
        run: |
          set -euo pipefail
          version=$(awk '/^COCOAPODS:/{print $2}' Podfile.lock)
          sudo gem install cocoapods -v "$version" --no-document
          echo "COCOAPODS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint podspec
        run: pod "_${COCOAPODS_VERSION}_" spec lint ZeroBounceSDK.podspec --allow-warnings

      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "Error: COCOAPODS_TRUNK_TOKEN secret is not set."
            exit 1
          fi
          pod "_${COCOAPODS_VERSION}_" trunk push ZeroBounceSDK.podspec --allow-warnings

  release:
    name: Create GitHub Release
    # Needs the validated tag and the passing tests, not the trunk push.
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          if [ -z "$TAG_SHA" ]; then
            echo "Error: validated tag SHA is missing."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --target "$TAG_SHA" \
              --generate-notes
          fi
